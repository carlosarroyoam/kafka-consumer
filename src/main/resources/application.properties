# Spring properties
spring.application.name=kafka-consumer

# Server properties
server.port=9090

# Logging properties
logging.level.root=INFO

# Kafka properties
spring.kafka.bootstrap-servers=PLAINTEXT://localhost:9092
spring.kafka.consumer.group-id=com.carlosarroyoam.kafka.message.created.consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.carlosarroyoam.service.kafka.*

# App Kafka properties
app.kafka.topics.message-created=message.created
